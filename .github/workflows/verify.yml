name: Verify RV32I core
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Run checks
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: build/
