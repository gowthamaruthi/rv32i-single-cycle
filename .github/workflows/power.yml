name: Power intent and isolation tests
on:
  push:
    paths: ['rtl/**', 'power/**', 'physical/image.txt', '.github/workflows/power.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: bash power/check.sh
      - run: python3 power/negative.py
      - name: Read and write UPF in OpenROAD
        run: docker run --rm --platform linux/amd64 --entrypoint bash -v "$PWD:/workspace" "$(cat physical/image.txt)" /workspace/power/in-container.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-intent-evidence
          path: build/power/
